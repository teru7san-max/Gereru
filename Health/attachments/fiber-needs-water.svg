<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.44;.47;.58;.62;1" dur="12s" repeatCount="indefinite"/>
<text x="250" y="60" font-size="12" fill="#3569b0">drink water</text>
<g><animateTransform attributeName="transform" type="translate" values="120 40;120 40;120 165" keyTimes="0;.46;.58" dur="12s" repeatCount="indefinite"/><path d="M0-10C4-4 7 0 7 4a7 7 0 0 1-14 0c0-4 3-8 7-14Z" fill="#b5d4f4" stroke="#3569b0" stroke-width="1.4"/></g>
<g><animateTransform attributeName="transform" type="translate" values="145 30;145 30;145 160" keyTimes="0;.48;.58" dur="12s" repeatCount="indefinite"/><path d="M0-10C4-4 7 0 7 4a7 7 0 0 1-14 0c0-4 3-8 7-14Z" fill="#b5d4f4" stroke="#3569b0" stroke-width="1.4"/></g>
<g><animateTransform attributeName="transform" type="translate" values="170 45;170 45;170 168" keyTimes="0;.50;.58" dur="12s" repeatCount="indefinite"/><path d="M0-10C4-4 7 0 7 4a7 7 0 0 1-14 0c0-4 3-8 7-14Z" fill="#b5d4f4" stroke="#3569b0" stroke-width="1.4"/></g>
</g>
<g opacity="0" transform="translate(140 180)"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.54;.58;1" dur="12s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="140 180;140 180;330 180;330 180" keyTimes="0;.64;.84;1" dur="12s" repeatCount="indefinite"/><circle r="14" fill="#d8f3e4" stroke="#1d9e75" stroke-width="2"><animate attributeName="r" values="14;14;21;21" keyTimes="0;.56;.63;1" dur="12s" repeatCount="indefinite"/></circle><path d="M-8-3q4-4 8 0t8 0M-8 5q4-4 8 0t8 0" fill="none" stroke="#5dcaa5" stroke-width="1.6"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.84;.87;1" dur="12s" repeatCount="indefinite"/><rect x="232" y="108" width="128" height="26" rx="8" fill="#d8f3e4"/><text x="296" y="125" font-size="11" fill="#0f6e56" text-anchor="middle">✓ soft gel, moves</text></g>
<text x="200" y="262" font-size="12.5" fill="#3569b0" text-anchor="middle" opacity="0">more fiber → drink more water 💧<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.88;.91;1" dur="12s" repeatCount="indefinite"/></text>
