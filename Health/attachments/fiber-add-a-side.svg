<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
<title>Keep the usual Mongolian meal of mutton, potato and buuz, and add fiber sides around it until the daily goal is reached</title>
