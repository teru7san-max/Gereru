<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
<title>A three-year plan with one paper a year: double-atom HER screening in year 1, a few-shot ML potential with uncertainty in year 2, and green hydrogen and CO2 catalysts plus the thesis in year 3</title>
<style>.ink{fill:#3b3b40}.muted{fill:#5f636b}.faint{fill:#8a8f98}.grid{stroke:#e9eaed}.wash-a{fill:#fff0c2;fill-opacity:.55}.wash-g{fill:#d8f3e4;fill-opacity:.7}.ok{fill:#0f6e56}@media (prefers-color-scheme:dark){.ink{fill:#e3e4e8}.muted{fill:#a8acb3}.grid{stroke:#3d4047}.wash-a{fill:#ba7517;fill-opacity:.2}.wash-g{fill:#1d9e75;fill-opacity:.22}.ok{fill:#4cc49b}}</style>
<g><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.02;.96;1" dur="12s" repeatCount="indefinite"/>
<text x="20" y="28" font-size="12" class="muted">a 3-year plan · one paper a year</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.03;0.07;1" dur="12s" repeatCount="indefinite"/><path d="M40 150V54" stroke="#ba7517" stroke-width="1.6"/><path d="M40 54h8l-3 5l3 5h-8" fill="#ba7517"/><text x="54" y="63" font-size="10.5" fill="#ba7517">step 0 · ask Li Fengyu about his NSFC grant</text></g>
<path d="M40 150H360" class="grid" stroke-width="3" stroke-linecap="round"/>
<path d="M40 150H360" stroke="#0f6e56" stroke-width="3" stroke-linecap="round" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.1;0.8;1" dur="12s" repeatCount="indefinite"/></path>
<path d="M147 144V156" class="grid" stroke-width="1.6"/>
<path d="M253 144V156" class="grid" stroke-width="1.6"/>
<text x="40" y="170" font-size="9.5" class="faint" text-anchor="middle">now</text>
<text x="93" y="138" font-size="10.5" class="muted" text-anchor="middle">year 1</text><text x="93" y="120" font-size="9.5" class="faint" text-anchor="middle" opacity="0">learn DFT + ML<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.156;0.186;1" dur="12s" repeatCount="indefinite"/></text>
<g opacity="0" transform="translate(0 -16)"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.216;0.246;1" dur="12s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 -16;0 -16;0 0;0 0" keyTimes="0;0.216;0.246;1" dur="12s" repeatCount="indefinite"/><rect x="45" y="178" width="96" height="66" rx="8" fill="#d8f3e4" stroke="#1d9e75" stroke-width="1.4"/><text x="93" y="197" font-size="10.5" font-weight="600" fill="#0f6e56" text-anchor="middle">paper 1 · B</text><text x="93" y="215" font-size="9.5" fill="#3b3b40" text-anchor="middle">double-atom HER</text><text x="93" y="230" font-size="9.5" fill="#3b3b40" text-anchor="middle">dataset + ML screen</text></g>
<text x="200" y="138" font-size="10.5" class="muted" text-anchor="middle">year 2</text><text x="200" y="120" font-size="9.5" class="faint" text-anchor="middle" opacity="0">learn MLIPs<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.39;0.42;1" dur="12s" repeatCount="indefinite"/></text>
<g opacity="0" transform="translate(0 -16)"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.48;1" dur="12s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 -16;0 -16;0 0;0 0" keyTimes="0;0.45;0.48;1" dur="12s" repeatCount="indefinite"/><rect x="152" y="178" width="96" height="66" rx="8" fill="#e8dcfd" stroke="#6a4bc0" stroke-width="1.4"/><text x="200" y="197" font-size="10.5" font-weight="600" fill="#4b3191" text-anchor="middle">paper 2 · D</text><text x="200" y="215" font-size="9.5" fill="#3b3b40" text-anchor="middle">few-shot MLIP</text><text x="200" y="230" font-size="9.5" fill="#3b3b40" text-anchor="middle">+ uncertainty</text></g>
<text x="307" y="138" font-size="10.5" class="muted" text-anchor="middle">year 3</text><text x="307" y="120" font-size="9.5" class="faint" text-anchor="middle" opacity="0">apply + write<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.624;0.654;1" dur="12s" repeatCount="indefinite"/></text>
<g opacity="0" transform="translate(0 -16)"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.684;0.714;1" dur="12s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 -16;0 -16;0 0;0 0" keyTimes="0;0.684;0.714;1" dur="12s" repeatCount="indefinite"/><rect x="259" y="178" width="96" height="66" rx="8" fill="#ffe3d0" stroke="#d85a30" stroke-width="1.4"/><text x="307" y="197" font-size="10.5" font-weight="600" fill="#993c1d" text-anchor="middle">paper 3 · F</text><text x="307" y="215" font-size="9.5" fill="#3b3b40" text-anchor="middle">H₂ / CO₂ catalysts</text><text x="307" y="230" font-size="9.5" fill="#3b3b40" text-anchor="middle">→ thesis</text></g>
<circle cx="40" cy="150" r="7" fill="#ffffff" stroke="#0f6e56" stroke-width="2.4"><animate attributeName="cx" values="40;40;360;360" keyTimes="0;0.1;0.8;1" dur="12s" repeatCount="indefinite"/></circle>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.83;1" dur="12s" repeatCount="indefinite"/><path d="M360 150V86" stroke="#0f6e56" stroke-width="1.6"/><text x="360" y="80" font-size="11.5" font-weight="600" class="ok" text-anchor="middle">PhD ✓</text></g>
<text x="200" y="278" font-size="12" class="ok" text-anchor="middle" opacity="0">each paper reuses the last one's data and code<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.87;1" dur="12s" repeatCount="indefinite"/></text>
</g></svg>
